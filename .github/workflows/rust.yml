name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build jlox treewalk interpreter
      run: cargo build --verbose --manifest-path jlox-treewalk-interpreter/Cargo.toml

    - name: Run jlox unit tests
      run: cargo test --verbose --manifest-path jlox-treewalk-interpreter/Cargo.toml

    - name: Run shared Lox test suite against jlox
      run: >
        cargo run --quiet --manifest-path test-runner/Cargo.toml --
        jlox-treewalk-interpreter/target/debug/jlox-treewalk-interpreter
        test
        --skip test/scanning
        --skip test/expressions
        --skip test/limit

